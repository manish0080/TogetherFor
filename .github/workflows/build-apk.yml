name: Build TogetherFor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q TogetherFor.zip -d source
          cp -a source/. .

      - name: Auto-Inject Midnight Rose Gold Theme & Fix Widgets
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path
          from xml.sax.saxutils import escape

          # 1. Find Project Root
          files = list(Path(".").rglob("widget_1.xml"))
          if not files:
              raise SystemExit("ERROR: widget_1.xml not found")

          widget = files[0]
          project = widget.parents[5]

          res_dir = project / "app/src/main/res"
          xml_dir = res_dir / "xml"
          values_dir = res_dir / "values"
          drawable_dir = res_dir / "drawable"
          layout_dir = res_dir / "layout"

          values_dir.mkdir(parents=True, exist_ok=True)
          drawable_dir.mkdir(parents=True, exist_ok=True)

          # -------------------------------------------------------------
          # 2. Fix Widget Descriptions in Strings & XML
          # -------------------------------------------------------------
          descriptions = {
              1: "Years Months Days relationship counter",
              2: "Days and clock relationship counter",
              3: "Total hours relationship counter",
              4: "Total minutes relationship counter",
              5: "Total seconds relationship counter",
              6: "Days plus clock relationship counter",
              7: "Clock only relationship counter",
          }

          strings_file = values_dir / "strings.xml"
          if strings_file.exists():
              strings_content = strings_file.read_text(encoding="utf-8")
          else:
              strings_content = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'

          for number, description in descriptions.items():
              file = xml_dir / f"widget_{number}.xml"
              if file.exists():
                  content = file.read_text(encoding="utf-8")
                  ref = f'android:description="@string/widget_{number}_description"'
                  content = re.sub(r'android:description\s*=\s*"[^"]*"', ref, content, count=1)
                  file.write_text(content, encoding="utf-8")

              name = f"widget_{number}_description"
              val = escape(description)
              pat = r'<string\s+name="' + re.escape(name) + r'"[^>]*>.*?</string>'
              rep = f'<string name="{name}">{val}</string>'
              if re.search(pat, strings_content, flags=re.DOTALL):
                  strings_content = re.sub(pat, rep, strings_content, count=1, flags=re.DOTALL)
              else:
                  strings_content = strings_content.replace("</resources>", f"    {rep}\n</resources>", 1)

          strings_file.write_text(strings_content, encoding="utf-8")
          print("✓ Widget descriptions successfully updated.")

          # -------------------------------------------------------------
          # 3. Inject Midnight Velvet & Rose Gold Colors
          # -------------------------------------------------------------
          colors_file = values_dir / "colors.xml"
          palette_entries = {
              "theme_bg_dark": "#120E16",
              "theme_surface": "#1C1624",
              "widget_bg_glass": "#D916111D",        # 85% Frosted Velvet (Looks stunning on any wallpaper)
              "widget_border_glow": "#4DE5B899",     # 30% Subtle Rose Gold Outline
              "accent_rose_gold": "#E5B899",       # Primary Digits & Counters
              "accent_blush": "#D47A88",           # Subtitles & Badges
              "text_primary_cream": "#FAF7F2",     # High-contrast readable white
              "text_secondary_lavender": "#A89CAD",# Muted labels
              "text_shadow_scrim": "#99000000"     # Readability drop-shadow for busy wallpapers
          }

          if colors_file.exists():
              c_content = colors_file.read_text(encoding="utf-8")
          else:
              c_content = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'

          for c_name, c_val in palette_entries.items():
              pat = r'<color\s+name="' + re.escape(c_name) + r'"[^>]*>.*?</color>'
              rep = f'<color name="{c_name}">{c_val}</color>'
              if re.search(pat, c_content):
                  c_content = re.sub(pat, rep, c_content, count=1)
              else:
                  c_content = c_content.replace("</resources>", f"    {rep}\n</resources>", 1)

          colors_file.write_text(c_content, encoding="utf-8")
          print("✓ Premium Color Palette successfully injected into colors.xml.")

          # -------------------------------------------------------------
          # 4. Create Adaptive Glassmorphism Drawable for Widgets
          # -------------------------------------------------------------
          drawable_xml = """<?xml version="1.0" encoding="utf-8"?>
<shape xmlns:android="http://schemas.android.com/apk/res/android"
    android:shape="rectangle">
    <solid android:color="@color/widget_bg_glass" />
    <corners android:radius="24dp" />
    <stroke
        android:width="1.2dp"
        android:color="@color/widget_border_glow" />
</shape>
"""
          (drawable_dir / "widget_bg_adaptive.xml").write_text(drawable_xml, encoding="utf-8")
          print("✓ Adaptive widget background drawable created.")

          # -------------------------------------------------------------
          # 5. Automatically Apply Glass Theme to All 7 Widget Layouts
          # -------------------------------------------------------------
          targeted_layouts = set()
          for num in range(1, 8):
              w_file = xml_dir / f"widget_{num}.xml"
              if w_file.exists():
                  w_txt = w_file.read_text(encoding="utf-8")
                  m = re.search(r'android:initialLayout="@layout/([^"]+)"', w_txt)
                  if m:
                      targeted_layouts.add(m.group(1))

          for layout_name in targeted_layouts:
              layout_file = layout_dir / f"{layout_name}.xml"
              if not layout_file.exists():
                  continue

              l_content = layout_file.read_text(encoding="utf-8")

              # Apply adaptive background to the root tag
              if 'android:background=' in l_content.split('>', 1)[0]:
                  l_content = re.sub(r'(<[\w\.]+\s[^>]*?android:background=")[^"]*(")', r'\1@drawable/widget_bg_adaptive\2', l_content, count=1)
              else:
                  l_content = re.sub(r'(<[\w\.]+\s)', r'\1android:background="@drawable/widget_bg_adaptive" ', l_content, count=1)

              # Add anti-wallpaper drop shadow & styling to all TextViews
              shadow_attrs = (
                  ' android:shadowColor="@color/text_shadow_scrim"'
                  ' android:shadowDx="0"'
                  ' android:shadowDy="2"'
                  ' android:shadowRadius="4"'
              )

              def patch_textview(match):
                  tag = match.group(0)
                  if "android:shadowColor" not in tag:
                      tag = tag[:-1].rstrip() + shadow_attrs + tag[-1]
                  # Color digits / counters in Rose Gold, labels in Cream
                  if any(k in tag.lower() for k in ["count", "day", "hour", "min", "sec", "time", "val", "num", "clock", "date"]):
                      if "android:textColor=" in tag:
                          tag = re.sub(r'android:textColor="[^"]*"', 'android:textColor="@color/accent_rose_gold"', tag)
                      else:
                          tag = tag[:-1].rstrip() + ' android:textColor="@color/accent_rose_gold"' + tag[-1]
                  else:
                      if "android:textColor=" in tag:
                          tag = re.sub(r'android:textColor="[^"]*"', 'android:textColor="@color/text_primary_cream"', tag)
                  return tag

              l_content = re.sub(r'<TextView\b[^>]*?>', patch_textview, l_content, flags=re.DOTALL)
              layout_file.write_text(l_content, encoding="utf-8")
              print(f"✓ Widget layout patched with glass styling: {layout_name}.xml")

          # -------------------------------------------------------------
          # 6. Apply Midnight Background to Main App Layout & Themes
          # -------------------------------------------------------------
          main_layout = layout_dir / "activity_main.xml"
          if main_layout.exists():
              m_content = main_layout.read_text(encoding="utf-8")
              if 'android:background=' in m_content.split('>', 1)[0]:
                  m_content = re.sub(r'(<[\w\.]+\s[^>]*?android:background=")[^"]*(")', r'\1@color/theme_bg_dark\2', m_content, count=1)
              else:
                  m_content = re.sub(r'(<[\w\.]+\s)', r'\1android:background="@color/theme_bg_dark" ', m_content, count=1)
              main_layout.write_text(m_content, encoding="utf-8")
              print("✓ Main activity layout set to Midnight Velvet background.")

          for theme_name in ["themes.xml", "styles.xml"]:
              t_file = values_dir / theme_name
              if t_file.exists():
                  t_content = t_file.read_text(encoding="utf-8")
                  item_bg = '    <item name="android:windowBackground">@color/theme_bg_dark</item>\n'
                  if "android:windowBackground" not in t_content:
                      t_content = t_content.replace("</style>", f"{item_bg}</style>", 1)
                      t_file.write_text(t_content, encoding="utf-8")

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"PROJECT_DIR={project.resolve()}\n")

          print("All themes and widgets have been completely stylized!")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TogetherFor-Themed-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

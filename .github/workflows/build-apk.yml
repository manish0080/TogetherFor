name: Build TogetherFor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q TogetherFor.zip -d source
          cp -a source/. .

      - name: Automatically fix widget descriptions and apply theme
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import os
          from xml.sax.saxutils import escape

          files = list(Path(".").rglob("widget_1.xml"))
          if not files:
              raise SystemExit("ERROR: widget_1.xml not found")

          widget = files[0]
          project = widget.parents[5]

          xml_dir = project / "app/src/main/res/xml"
          values_dir = project / "app/src/main/res/values"
          drawable_dir = project / "app/src/main/res/drawable"
          layout_dir = project / "app/src/main/res/layout"

          values_dir.mkdir(parents=True, exist_ok=True)
          drawable_dir.mkdir(parents=True, exist_ok=True)

          # 1. Widget Descriptions
          descriptions = {
              1: "Years Months Days relationship counter",
              2: "Days and clock relationship counter",
              3: "Total hours relationship counter",
              4: "Total minutes relationship counter",
              5: "Total seconds relationship counter",
              6: "Days plus clock relationship counter",
              7: "Clock only relationship counter",
          }

          strings_file = values_dir / "strings.xml"

          for number in descriptions:
              file = xml_dir / f"widget_{number}.xml"

              if not file.exists():
                  raise SystemExit(f"ERROR: Missing {file}")

              content = file.read_text(encoding="utf-8")
              reference = (
                  f'android:description="@string/'
                  f'widget_{number}_description"'
              )

              content, count = re.subn(
                  r'android:description\s*=\s*"[^"]*"',
                  reference,
                  content,
                  count=1
              )

              if count == 0:
                  raise SystemExit(
                      f"ERROR: description attribute not found in {file}"
                  )

              file.write_text(content, encoding="utf-8")
              print(f"Fixed {file}")

          if strings_file.exists():
              content = strings_file.read_text(encoding="utf-8")
          else:
              content = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'

          if "</resources>" not in content:
              raise SystemExit("ERROR: Invalid strings.xml")

          for number, description in descriptions.items():
              name = f"widget_{number}_description"
              value = escape(description)

              pattern = (
                  r'<string\s+name="' + re.escape(name) +
                  r'"[^>]*>.*?</string>'
              )
              replacement = f'<string name="{name}">{value}</string>'

              if re.search(pattern, content, flags=re.DOTALL):
                  content = re.sub(
                      pattern, replacement, content,
                      count=1, flags=re.DOTALL
                  )
              else:
                  content = content.replace(
                      "</resources>",
                      f"    {replacement}\n</resources>",
                      1
                  )

          strings_file.write_text(content, encoding="utf-8")
          print("Strings updated.")

          # 2. Inject Midnight Velvet Colors
          colors_file = values_dir / "colors.xml"
          if colors_file.exists():
              colors_content = colors_file.read_text(encoding="utf-8")
          else:
              colors_content = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'

          theme_colors = {
              "theme_bg_dark": "#120E16",
              "theme_surface": "#1C1624",
              "widget_bg_glass": "#D916111D",
              "widget_border_glow": "#4DE5B899",
              "accent_rose_gold": "#E5B899",
              "accent_blush": "#D47A88",
              "text_primary_cream": "#FAF7F2",
              "text_secondary_lavender": "#A89CAD"
          }

          for color_name, hex_code in theme_colors.items():
              c_pattern = r'<color\s+name="' + re.escape(color_name) + r'"[^>]*>.*?</color>'
              c_repl = f'<color name="{color_name}">{hex_code}</color>'
              if re.search(c_pattern, colors_content):
                  colors_content = re.sub(c_pattern, c_repl, colors_content, count=1)
              else:
                  colors_content = colors_content.replace(
                      "</resources>",
                      f"    {c_repl}\n</resources>",
                      1
                  )
          colors_file.write_text(colors_content, encoding="utf-8")
          print("Colors injected.")

          # 3. Create Adaptive Glass Background
          drawable_content = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<shape xmlns:android="http://schemas.android.com/apk/res/android"\n'
              '    android:shape="rectangle">\n'
              '    <solid android:color="@color/widget_bg_glass" />\n'
              '    <corners android:radius="24dp" />\n'
              '    <stroke\n'
              '        android:width="1.2dp"\n'
              '        android:color="@color/widget_border_glow" />\n'
              '</shape>\n'
          )
          (drawable_dir / "widget_bg_adaptive.xml").write_text(drawable_content, encoding="utf-8")
          print("Adaptive background created.")

          # 4. Safe Background Replacement on Widget Layouts
          for number in range(1, 8):
              w_xml = xml_dir / f"widget_{number}.xml"
              if not w_xml.exists():
                  continue
              w_text = w_xml.read_text(encoding="utf-8")
              match = re.search(r'android:initialLayout="@layout/([^"]+)"', w_text)
              if not match:
                  continue
              target_layout_name = match.group(1)
              target_file = layout_dir / f"{target_layout_name}.xml"
              if not target_file.exists():
                  continue

              l_text = target_file.read_text(encoding="utf-8")

              def replace_bg(m):
                  tag_open = m.group(1)
                  tag_name = m.group(2)
                  tag_rest = m.group(3)
                  tag_close = m.group(4)
                  if 'android:background=' in tag_rest:
                      tag_rest = re.sub(r'android:background="[^"]*"', 'android:background="@drawable/widget_bg_adaptive"', tag_rest)
                  else:
                      tag_rest = f' android:background="@drawable/widget_bg_adaptive"{tag_rest}'
                  return f"{tag_open}{tag_name}{tag_rest}{tag_close}"

              l_text = re.sub(r'(<)(\w+(?:\.\w+)*)(\s+[^>]*?)(\/?>)', replace_bg, l_text, count=1)
              target_file.write_text(l_text, encoding="utf-8")
              print(f"Applied glass background to {target_layout_name}.xml")

          # 5. Check Gradle settings
          if not (project / "settings.gradle").exists() and not (
              project / "settings.gradle.kts"
          ).exists():
              raise SystemExit(
                  f"ERROR: Gradle settings file not found in {project}"
              )

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(

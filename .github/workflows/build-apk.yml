name: Build TogetherFor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q TogetherFor.zip -d source
          cp -a source/. .

      - name: Apply Midnight Velvet Theme Across Entire App
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path
          from xml.sax.saxutils import escape

          # 1. Project directory
          settings = list(Path(".").rglob("settings.gradle*"))
          if not settings:
              raise SystemExit("ERROR: settings.gradle not found")
          project = settings[0].parent

          res_dirs = list(project.rglob("src/main/res"))
          if not res_dirs:
              raise SystemExit("ERROR: src/main/res not found")
          res = res_dirs[0]
          src_main = res.parent

          val_d = res / "values"
          draw_d = res / "drawable"
          xml_d = res / "xml"

          val_d.mkdir(parents=True, exist_ok=True)
          draw_d.mkdir(parents=True, exist_ok=True)

          # 2. Fix widget descriptions and remove literal \n glitch
          descs = {
              1: "Years Months Days relationship counter",
              2: "Days and clock relationship counter",
              3: "Total hours relationship counter",
              4: "Total minutes relationship counter",
              5: "Total seconds relationship counter",
              6: "Days plus clock relationship counter",
              7: "Clock only relationship counter"
          }

          str_f = val_d / "strings.xml"
          s_txt = str_f.read_text("utf-8") if str_f.exists() else '<resources>\n</resources>\n'

          for n, d in descs.items():
              w_f = xml_d / f"widget_{n}.xml"
              if w_f.exists():
                  w_c = re.sub(r'android:description\s*=\s*"[^"]*"', f'android:description="@string/widget_{n}_description"', w_f.read_text("utf-8"), count=1)
                  w_f.write_text(w_c, "utf-8")
              name = f"widget_{n}_description"
              tag = f'<string name="{name}">{escape(d)}</string>'
              pat = rf'<string\s+name="{name}"[^>]*>.*?</string>'
              if re.search(pat, s_txt, flags=re.DOTALL):
                  s_txt = re.sub(pat, tag, s_txt, count=1, flags=re.DOTALL)
              else:
                  s_txt = s_txt.replace("</resources>", f"    {tag}\n</resources>", 1)

          s_txt = s_txt.replace(r'\n', '\n').replace(r'\\n', '\n')
          str_f.write_text(s_txt, "utf-8")

          # 3. Inject Luxury Colors
          col_f = val_d / "colors.xml"
          c_txt = col_f.read_text("utf-8") if col_f.exists() else '<resources>\n</resources>\n'

          palette = {
              "theme_bg_dark": "#120E16",
              "theme_surface": "#1C1624",
              "widget_bg_glass": "#D916111D",
              "widget_border_glow": "#4DE5B899",
              "accent_rose_gold": "#E5B899",
              "accent_blush": "#D47A88",
              "text_primary_cream": "#FAF7F2",
              "text_secondary_lavender": "#A89CAD",
              "btn_dark_label": "#120E16"
          }

          for k, v in palette.items():
              pat = rf'<color\s+name="{k}"[^>]*>.*?</color>'
              tag = f'<color name="{k}">{v}</color>'
              if re.search(pat, c_txt):
                  c_txt = re.sub(pat, tag, c_txt, count=1)
              else:
                  c_txt = c_txt.replace("</resources>", f"    {tag}\n</resources>", 1)
          col_f.write_text(c_txt, "utf-8")

          # 4. Generate Drawables
          bg_widget = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n'
              '    <solid android:color="@color/widget_bg_glass" />\n'
              '    <corners android:radius="24dp" />\n'
              '    <stroke android:width="1.2dp" android:color="@color/widget_border_glow" />\n'
              '</shape>\n'
          )
          (draw_d / "widget_bg_adaptive.xml").write_text(bg_widget, "utf-8")

          bg_btn = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n'
              '    <solid android:color="@color/accent_rose_gold" />\n'
              '    <corners android:radius="24dp" />\n'
              '</shape>\n'
          )
          (draw_d / "btn_rose_gold.xml").write_text(bg_btn, "utf-8")

          # 5. Overhaul Themes & Styles
          theme_injection = (
              '    <item name="android:windowBackground">@color/theme_bg_dark</item>\n'
              '    <item name="android:colorBackground">@color/theme_bg_dark</item>\n'
              '    <item name="colorSurface">@color/theme_surface</item>\n'
              '    <item name="colorPrimary">@color/accent_rose_gold</item>\n'
              '    <item name="colorOnPrimary">@color/btn_dark_label</item>\n'
              '    <item name="colorOnBackground">@color/text_primary_cream</item>\n'
              '    <item name="colorOnSurface">@color/text_primary_cream</item>\n'
              '    <item name="android:textColorPrimary">@color/text_primary_cream</item>\n'
              '    <item name="android:textColorSecondary">@color/text_secondary_lavender</item>\n'
              '    <item name="android:statusBarColor">@color/theme_bg_dark</item>\n'
              '    <item name="android:windowLightStatusBar">false</item>\n'
              '    <item name="android:navigationBarColor">@color/theme_bg_dark</item>\n'
          )
          for tf in res.rglob("*.xml"):
              if tf.parent.name.startswith("values") and any(x in tf.name.lower() for x in ["theme", "style"]):
                  t_content = tf.read_text("utf-8")
                  t_content = re.sub(r'parent="Theme\.(?:Material3|MaterialComponents)\.Light', 'parent="Theme.Material3.DayNight', t_content)
                  t_content = re.sub(r'<item name="android:windowLightStatusBar">true</item>', '<item name="android:windowLightStatusBar">false</item>', t_content)
                  if "theme_bg_dark" not in t_content and "</style>" in t_content:
                      t_content = t_content.replace("</style>", theme_injection + "</style>", 1)
                  tf.write_text(t_content, "utf-8")

          # 6. Restyle Layouts (Root Background, Buttons & Typography)
          for lf in res.rglob("layout*/*.xml"):
              l_txt = lf.read_text("utf-8")
              is_widget = "widget" in lf.name.lower()

              root_m = re.search(r'(<[a-zA-Z0-9_\.]+\b)([^>]*?)(\/?>)', l_txt)
              if root_m and not root_m.group(1).startswith("<?xml"):
                  tg, at, cl = root_m.group(1), root_m.group(2), root_m.group(3)
                  chosen_bg = "@drawable/widget_bg_adaptive" if is_widget else "@color/theme_bg_dark"
                  if 'android:background=' in at:
                      at = re.sub(r'android:background="[^"]*"', f'android:background="{chosen_bg}"', at)
                  else:
                      at = f' android:background="{chosen_bg}"' + at
                  l_txt = l_txt[:root_m.start()] + tg + at + cl + l_txt[root_m.end():]

              l_txt = re.sub(r'android:background="(?:#[fF]{3,8}|@android:color\/white|@color\/white)"', 'android:background="@color/theme_bg_dark"', l_txt)

              def style_btn(m):
                  tag_open, attrs, tag_close = m.group(1), m.group(2), m.group(3)
                  attrs = re.sub(r'android:background(?:Tint)?="[^"]*"', '', attrs)
                  attrs = re.sub(r'android:textColor="[^"]*"', '', attrs)
                  attrs += ' android:background="@drawable/btn_rose_gold" android:textColor="@color/btn_dark_label" android:textStyle="bold"'
                  return tag_open + attrs + tag_close

              l_txt = re.sub(r'(<(?:Button|com\.google\.android\.material\.button\.MaterialButton|androidx\.appcompat\.widget\.AppCompatButton)\b)([^>]*?)(\/?>)', style_btn, l_txt)

              def style_tv(m):
                  tag_open, attrs, tag_close = m.group(1), m.group(2), m.group(3)
                  if 'android:textColor=' in attrs:
                      if any(k in attrs.lower() for k in ["title", "head", "count", "together"]):
                          attrs = re.sub(r'android:textColor="[^"]*"', 'android:textColor="@color/accent_rose_gold"', attrs)
                      else:
                          attrs = re.sub(r'android:textColor="[^"]*"', 'android:textColor="@color/text_primary_cream"', attrs)
                  else:
                      attrs += ' android:textColor="@color/text_primary_cream"'
                  return tag_open + attrs + tag_close

              l_txt = re.sub(r'(<(?:TextView|androidx\.appcompat\.widget\.AppCompatTextView)\b)([^>]*?)(\/?>)', style_tv, l_txt)
              lf.write_text(l_txt, "utf-8")

          # 7. Jetpack Compose Force Dark Overrides
          for kf in src_main.rglob("*.kt"):
              k_txt = kf.read_text("utf-8")
              orig_k = k_txt
              k_txt = re.sub(r'darkTheme:\s*Boolean\s*=\s*isSystemInDarkTheme\(\)', 'darkTheme: Boolean = true', k_txt)
              k_txt = re.sub(r'isSystemInDarkTheme\(\)', 'true', k_txt)
              if "lightColorScheme(" in k_txt:
                  k_txt = re.sub(r'background\s*=\s*[^,\)]+', 'background = androidx.compose.ui.graphics.Color(0xFF120E16)', k_txt)
                  k_txt = re.sub(r'surface\s*=\s*[^,\)]+', 'surface = androidx.compose.ui.graphics.Color(0xFF1C1624)', k_txt)
                  k_txt = re.sub(r'primary\s*=\s*[^,\)]+', 'primary = androidx.compose.ui.graphics.Color(0xFFE5B899)', k_txt)
                  k_txt = re.sub(r'onBackground\s*=\s*[^,\)]+', 'onBackground = androidx.compose.ui.graphics.Color(0xFFFAF7F2)', k_txt)
                  k_txt = re.sub(r'onSurface\s*=\s*[^,\)]+', 'onSurface = androidx.compose.ui.graphics.Color(0xFFFAF7F2)', k_txt)
                  k_txt = re.sub(r'onPrimary\s*=\s*[^,\)]+', 'onPrimary = androidx.compose.ui.graphics.Color(0xFF120E16)', k_txt)
              if k_txt != orig_k:
                  kf.write_text(k_txt, "utf-8")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PROJECT_DIR={project.resolve()}\n")

          print("Midnight Velvet Theme successfully applied.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TogetherFor-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

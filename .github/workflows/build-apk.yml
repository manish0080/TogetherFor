
name: Build TogetherFor APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check ZIP file
        run: |
          if [ ! -f "TogetherFor.zip" ]; then
            echo "ERROR: TogetherFor.zip not found in repository root."
            echo "Files available in repository:"
            ls -la
            exit 1
          fi

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q TogetherFor.zip -d project
          echo "Extracted project files:"
          find project -maxdepth 3 -type f | head -80

          if [ ! -f "project/settings.gradle" ] && \
             [ ! -f "project/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle not found at ZIP root."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TogetherFor-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

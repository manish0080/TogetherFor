name: Build TogetherFor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q TogetherFor.zip -d source
          cp -a source/. .

      - name: Inject Midnight Rose Theme & Fix Widgets
        shell: bash
        run: |
          python3 - <<'EOF'
          import os, re
          from pathlib import Path
          from xml.sax.saxutils import escape

          files = list(Path(".").rglob("widget_1.xml"))
          if not files: raise SystemExit("ERROR: widget_1.xml not found")
          project = files[0].parents[5]

          res = project / "app/src/main/res"
          xml_d, val_d = res / "xml", res / "values"
          draw_d, lay_d = res / "drawable", res / "layout"
          val_d.mkdir(parents=True, exist_ok=True)
          draw_d.mkdir(parents=True, exist_ok=True)

          # 1. Descriptions
          descs = {
              1: "Years Months Days relationship counter",
              2: "Days and clock relationship counter",
              3: "Total hours relationship counter",
              4: "Total minutes relationship counter",
              5: "Total seconds relationship counter",
              6: "Days plus clock relationship counter",
              7: "Clock only relationship counter"
          }
          str_f = val_d / "strings.xml"
          s_txt = str_f.read_text("utf-8") if str_f.exists() else '<resources>\n</resources>'
          for n, d in descs.items():
              w_f = xml_d / f"widget_{n}.xml"
              if w_f.exists():
                  w_txt = re.sub(r'android:description\s*=\s*"[^"]*"', f'android:description="@string/widget_{n}_description"', w_f.read_text("utf-8"), count=1)
                  w_f.write_text(w_txt, "utf-8")
              tag = f'<string name="widget_{n}_description">{escape(d)}</string>'
              if f'name="widget_{n}_description"' in s_txt:
                  s_txt = re.sub(rf'<string\s+name="widget_{n}_description"[^>]*>.*?</string>', tag, s_txt, flags=re.DOTALL)
              else:
                  s_txt = s_txt.replace("</resources>", f"    {tag}\n</resources>")
          str_f.write_text(s_txt, "utf-8")

          # 2. Colors Injection
          col_f = val_d / "colors.xml"
          c_txt = col_f.read_text("utf-8") if col_f.exists() else '<resources>\n</resources>'
          colors = {
              "theme_bg_dark": "#120E16",
              "theme_surface": "#1C1624",
              "widget_bg_glass": "#D916111D",
              "widget_border_glow": "#4DE5B899",
              "accent_rose_gold": "#E5B899",
              "accent_blush": "#D47A88",
              "text_primary_cream": "#FAF7F2",
              "text_secondary_lavender": "#A89CAD"
          }
          for k, v in colors.items():
              if f'name="{k}"' not in c_txt:
                  c_txt = c_txt.replace("</resources>", f'    <color name="{k}">{v}</color>\n</resources>')
          col_f.write_text(c_txt, "utf-8")

          # 3. Adaptive Glass Drawable
          bg_xml = ('<?xml version="1.0" encoding="utf-8"?>\n'
                    '<shape xmlns:android="http://schemas.android.com/apk/res/android">\n'
                    '    <solid android:color="@color/widget_bg_glass" />\n'
                    '    <corners android:radius="24dp" />\n'
                    '    <stroke android:width="1.2dp" android:color="@color/widget_border_glow" />\n'
                    '</shape>\n')
          (draw_d / "widget_bg_adaptive.xml").write_text(bg_xml, "utf-8")

          # 4. Patch Widget Layouts with Glass Background
          for n in range(1, 8):
              w_f = xml_d / f"widget_{n}.xml"
              if not w_f.exists(): continue
              m = re.search(r'android:initialLayout="@layout/([^"]+)"', w_f.read_text("utf-8"))
              if m:
                  l_f = lay_d / f"{m.group(1)}.xml"
                  if l_f.exists():
                      l_txt = l_f.read_text("utf-8")
                      l_txt = re.sub(r'android:background="[^"]*"', '', l_txt)
                      l_txt = re.sub(r'(<\w+(?:\.\w+)*)', r'\1 android:background="@drawable/widget_bg_adaptive"', l_txt, count=1)
                      l_f.write_text(l_txt, "utf-8")

          # 5. Patch Main App Background
          main_f = lay_d / "activity_main.xml"
          if main_f.exists():
              m_txt = main_f.read_text("utf-8")
              m_txt = re.sub(r'android:background="[^"]*"', '', m_txt)
              m_txt = re.sub(r'(<\w+(?:\.\w+)*)', r'\1 android:background="@color/theme_bg_dark"', m_txt, count=1)
              main_f.write_text(m_txt, "utf-8")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PROJECT_DIR={project.resolve()}\n")
          print("SUCCESS: Theme injected successfully!")
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TogetherFor-Themed-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

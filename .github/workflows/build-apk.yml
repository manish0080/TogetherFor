name: Build TogetherFor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q TogetherFor.zip -d source
          cp -a source/. .

      - name: Fix Widgets and Inject Theme
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path
          from xml.sax.saxutils import escape

          # 1. Project Root Locator
          files = list(Path(".").rglob("widget_1.xml"))
          if not files:
              raise SystemExit("ERROR: widget_1.xml not found")

          widget = files[0]
          project = widget.parents[5]

          res_dir = project / "app/src/main/res"
          xml_dir = res_dir / "xml"
          values_dir = res_dir / "values"
          drawable_dir = res_dir / "drawable"
          layout_dir = res_dir / "layout"

          values_dir.mkdir(parents=True, exist_ok=True)
          drawable_dir.mkdir(parents=True, exist_ok=True)

          # 2. Original Widget Descriptions Fix
          descriptions = {
              1: "Years Months Days relationship counter",
              2: "Days and clock relationship counter",
              3: "Total hours relationship counter",
              4: "Total minutes relationship counter",
              5: "Total seconds relationship counter",
              6: "Days plus clock relationship counter",
              7: "Clock only relationship counter",
          }

          strings_file = values_dir / "strings.xml"
          if strings_file.exists():
              strings_content = strings_file.read_text(encoding="utf-8")
          else:
              strings_content = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'

          if "</resources>" not in strings_content:
              raise SystemExit("ERROR: Invalid strings.xml")

          for number in descriptions:
              file = xml_dir / f"widget_{number}.xml"
              if not file.exists():
                  raise SystemExit(f"ERROR: Missing {file}")

              content = file.read_text(encoding="utf-8")
              reference = f'android:description="@string/widget_{number}_description"'
              content, count = re.subn(r'android:description\s*=\s*"[^"]*"', reference, content, count=1)
              if count == 0:
                  raise SystemExit(f"ERROR: description attribute not found in {file}")
              file.write_text(content, encoding="utf-8")

          for number, description in descriptions.items():
              name = f"widget_{number}_description"
              value = escape(description)
              pattern = r'<string\s+name="' + re.escape(name) + r'"[^>]*>.*?</string>'
              replacement = f'<string name="{name}">{value}</string>'
              if re.search(pattern, strings_content, flags=re.DOTALL):
                  strings_content = re.sub(pattern, replacement, strings_content, count=1, flags=re.DOTALL)
              else:
                  strings_content = strings_content.replace("</resources>", f"    {replacement}\n</resources>", 1)

          strings_file.write_text(strings_content, encoding="utf-8")
          print("Fixed widget descriptions.")

          # 3. Inject Colors
          colors_file = values_dir / "colors.xml"
          palette_entries = {
              "theme_bg_dark": "#120E16",
              "theme_surface": "#1C1624",
              "widget_bg_glass": "#D916111D",
              "widget_border_glow": "#4DE5B899",
              "accent_rose_gold": "#E5B899",
              "accent_blush": "#D47A88",
              "text_primary_cream": "#FAF7F2",
              "text_secondary_lavender": "#A89CAD"
          }

          if colors_file.exists():
              c_content = colors_file.read_text(encoding="utf-8")
          else:
              c_content = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'

          for c_name, c_val in palette_entries.items():
              pat = r'<color\s+name="' + re.escape(c_name) + r'"[^>]*>.*?</color>'
              rep = f'<color name="{c_name}">{c_val}</color>'
              if re.search(pat, c_content):
                  c_content = re.sub(pat, rep, c_content, count=1)
              else:
                  c_content = c_content.replace("</resources>", f"    {rep}\n</resources>", 1)

          colors_file.write_text(c_content, encoding="utf-8")
          print("Colors injected.")

          # 4. Create Adaptive Glass Background
          drawable_xml = """<?xml version="1.0" encoding="utf-8"?>
<shape xmlns:android="http://schemas.android.com/apk/res/android"
    android:shape="rectangle">
    <solid android:color="@color/widget_bg_glass" />
    <corners android:radius="24dp" />
    <stroke
        android:width="1.2dp"
        android:color="@color/widget_border_glow" />
</shape>
"""
          (drawable_dir / "widget_bg_adaptive.xml").write_text(drawable_xml, encoding="utf-8")
          print("Adaptive background created.")

          # 5. Safe Background Replacement on Widget Layouts
          targeted_layouts = set()
          for num in range(1, 8):
              w_file = xml_dir / f"widget_{num}.xml"
              if w_file.exists():
                  w_txt = w_file.read_text(encoding="utf-8")
                  m = re.search(r'android:initialLayout="@layout/([^"]+)"', w_txt)
                  if m:
                      targeted_layouts.add(m.group(1))

          for layout_name in targeted_layouts:
              layout_file = layout_dir / f"{layout_name}.xml"
              if not layout_file.exists():
                  continue

              l_content = layout_file.read_text(encoding="utf-8")

              # Match the first layout tag safely without breaking self-closing tags
              root_match = re.search(r'(<\w+(?:\.\w+)*\s+[^>]*?)(\/?>)', l_content)
              if root_match:
                  root_header = root_match.group(1)
                  root_closing = root_match.group(2)
                  if 'android:background=' in root_header:
                      root_header = re.sub(r'android:background="[^"]*"', 'android:background="@drawable/widget_bg_adaptive"', root_header)
                  else:
                      root_header += ' android:background="@drawable/widget_bg_adaptive"'
                  l_content = l_content[:root_match.start()] + root_header + root_closing + l_content[root_match.end():]
                  layout_file.write_text(l_content, encoding="utf-8")
                  print(f"Patched layout: {layout_name}.xml")

          # 6. Apply Dark Velvet to Main Activity
          main_layout = layout_dir / "activity_main.xml"
          if main_layout.exists():
              m_content = main_layout.read_text(encoding="utf-8")
              root_match = re.search(r'(<\w+(?:\.\w+)*\s+[^>]*?)(\/?>)', m_content)
              if root_match:
                  root_header = root_match.group(1)
                  root_closing = root_match.group(2)
                  if 'android:background=' in root_header:
                      root_header = re.sub(r'android:background="[^"]*"', 'android:background="@color/theme_bg_dark"', root_header)
                  else:
                      root_header += ' android:background="@color/theme_bg_dark"'
                  m_content = m_content[:root_match.start()] + root_header + root_closing + m_content[root_match.end():]
                  main_layout.write_text(m_content, encoding="utf-8")
                  print("Main layout updated.")

          # 7. Check Gradle settings
          if not (project / "settings.gradle").exists() and not (
              project / "settings.gradle.kts"
          ).exists():
              raise SystemExit(
                  f"ERROR: Gradle settings file not found in {project}"
              )

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"PROJECT_DIR={project.resolve()}\n")

          print("Build preparation completed successfully.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TogetherFor-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

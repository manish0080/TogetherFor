
name: Build TogetherFor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          mkdir -p source

          if [ -f "TogetherFor.zip" ]; then
            unzip -oq "TogetherFor.zip" -d source
          else
            echo "ERROR: TogetherFor.zip not found in repository root"
            ls -la
            exit 1
          fi

          echo "Extracted files:"
          find source -maxdepth 4 -type f | head -100

      - name: Locate Android project
        shell: bash
        run: |
          set -e
          if [ -f "source/project/gradlew" ]; then
            echo "PROJECT_DIR=source/project" >> "$GITHUB_ENV"
          elif [ -f "source/gradlew" ]; then
            echo "PROJECT_DIR=source" >> "$GITHUB_ENV"
          else
            echo "ERROR: gradlew not found inside extracted ZIP"
            find source -name gradlew -o -name settings.gradle -o -name settings.gradle.kts
            exit 1
          fi

      - name: Fix widget descriptions
        shell: bash
        run: |
          set -e
          RES="$PROJECT_DIR/app/src/main/res"
          STRINGS="$RES/values/strings.xml"

          mkdir -p "$RES/values"

          if [ ! -f "$STRINGS" ]; then
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<resources>' \
              '    <string name="widget_desc_1">Years Months Days relationship counter</string>' \
              '    <string name="widget_desc_2">Days and clock relationship counter</string>' \
              '    <string name="widget_desc_3">Total hours relationship counter</string>' \
              '    <string name="widget_desc_4">Total minutes relationship counter</string>' \
              '    <string name="widget_desc_5">Total seconds relationship counter</string>' \
              '    <string name="widget_desc_6">Days plus clock relationship counter</string>' \
              '    <string name="widget_desc_7">Clock only relationship counter</string>' \
              '</resources>' > "$STRINGS"
          else
            python3 - "$STRINGS" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          tree = ET.parse(path)
          root = tree.getroot()

          descriptions = {
              "widget_desc_1": "Years Months Days relationship counter",
              "widget_desc_2": "Days and clock relationship counter",
              "widget_desc_3": "Total hours relationship counter",
              "widget_desc_4": "Total minutes relationship counter",
              "widget_desc_5": "Total seconds relationship counter",
              "widget_desc_6": "Days plus clock relationship counter",
              "widget_desc_7": "Clock only relationship counter",
          }

          existing = {e.get("name") for e in root.findall("string")}
          for name, value in descriptions.items():
              if name not in existing:
                  element = ET.SubElement(root, "string", {"name": name})
                  element.text = value

          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY
          fi

          python3 - "$RES/xml" <<'PY'
          import sys
          import pathlib
          import re

          folder = pathlib.Path(sys.argv[1])
          descriptions = {
              "widget_1.xml": "@string/widget_desc_1",
              "widget_2.xml": "@string/widget_desc_2",
              "widget_3.xml": "@string/widget_desc_3",
              "widget_4.xml": "@string/widget_desc_4",
              "widget_5.xml": "@string/widget_desc_5",
              "widget_6.xml": "@string/widget_desc_6",
              "widget_7.xml": "@string/widget_desc_7",
          }

          for filename, reference in descriptions.items():
              path = folder / filename
              if not path.exists():
                  continue
              content = path.read_text(encoding="utf-8")
              content, count = re.subn(
                  r'android:description\s*=\s*"[^"]*"',
                  f'android:description="{reference}"',
                  content,
                  count=1
              )
              if count:
                  path.write_text(content, encoding="utf-8")
                  print(f"Fixed {filename}")
              else:
                  print(f"No description attribute changed in {filename}")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TogetherFor-debug-apk
          path: source/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
